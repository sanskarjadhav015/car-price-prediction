<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Price Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <style>
body {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* Main wrapper */
.page-wrapper {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* Center card */
.main-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 15px;
}

/* Card */
.card {
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    border: none;
}

h1 {
    font-weight: 700;
    color: #ffffff;
}

.form-label {
    font-weight: 600;
    color: #e5e7eb;
}

.form-control,
.form-select {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #ffffff;
    border-radius: 12px;
}

.form-control:focus,
.form-select:focus {
    border-color: #00ffcc;
    box-shadow: 0 0 0 0.2rem rgba(0, 255, 204, 0.25);
}

/* Button */
.btn-primary {
    background: linear-gradient(90deg, #00ffcc, #38bdf8);
    border: none;
    border-radius: 14px;
    font-weight: 600;
}

.btn-primary:hover {
    background: linear-gradient(90deg, #38bdf8, #00ffcc);
}

/* Footer */
.footer {
    padding: 20px;
    text-align: center;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(10px);
}

.footer p {
    margin: 6px 0;
    color: #e5e7eb;
}

.footer a {
    color: #00ffcc;
    text-decoration: none;
    font-weight: 600;
    margin: 0 8px;
}

.footer a:hover {
    color: #38bdf8;
    text-decoration: underline;
}
</style>

</head>
<body>

<div class="container">
    <div class="card p-4">
        <h1 class="text-center mb-4">Car Price Prediction</h1>
        <form method="post">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Year</label>
                    <input type="number" class="form-control" name="year" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Kilometers Driven</label>
                    <input type="number" class="form-control" name="kilometers_driven" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Fuel Type</label>
                    <select class="form-select" name="fuel_type" required>
                        <option value="Petrol">Petrol</option>
                        <option value="Diesel">Diesel</option>
                        <option value="CNG">CNG</option>
                        <option value="LPG">LPG</option>
                        <option value="Electric">Electric</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Transmission</label>
                    <select class="form-select" name="transmission" required>
                        <option value="Manual">Manual</option>
                        <option value="Automatic">Automatic</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Owner Type</label>
                    <select class="form-select" name="owner_type" required>
                        <option value="First">First</option>
                        <option value="Second">Second</option>
                        <option value="Third">Third</option>
                        <option value="Fourth & Above">Fourth & Above</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Seats</label>
                    <input type="number" step="0.5" class="form-control" name="seats" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Mileage (in kmpl)</label>
                    <input type="number" step="0.1" class="form-control" name="mileage" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Engine (in CC)</label>
                    <input type="number" class="form-control" name="engine" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Power (in bhp)</label>
                    <input type="number" class="form-control" name="power" required>
                </div>
                <div class="col-md-6 d-grid">
                    <button type="submit" class="btn btn-primary">Predict Price</button>
                </div>
            </div>
        </form>

        {% if predicted_price is not none %}
            <div class="alert alert-success mt-4 text-center">
                <h4>Predicted Price: ₹ {{ predicted_price | round(2) }} Lakh</h4>
            </div>
        {% endif %}
    </div>
</div>
